# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                         GENTLEMAN DOTS - ALACRITTY                           ║
# ║                          Optimized for Neovim                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                   FONT                                       │
# └──────────────────────────────────────────────────────────────────────────────┘

[font]
size = 14

[font.normal]
family = "IosevkaTerm NF"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  WINDOW                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

[window]
opacity = 0.95
blur = true
option_as_alt = "Both"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                  CURSOR                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

[cursor]
style = "Block"
blink_interval = 500
unfocused_hollow = true
vi_mode_style = "Block"


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                                 TERMINAL                                     │
# └──────────────────────────────────────────────────────────────────────────────┘

[terminal]
# For best Neovim compatibility, install alacritty terminfo:
# sudo tic -xe alacritty,alacritty-direct extra/alacritty.info

[terminal.shell]
program = "/home/linuxbrew/.linuxbrew/bin/fish"

[env]
TERM = "xterm-256color"

[hints]
enabled = []


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                           SOLARIZED DARK                                     │
# └──────────────────────────────────────────────────────────────────────────────┘

# --- Base Colors ---
[colors.primary]
background = "#002b36"
foreground = "#839496"

[colors.cursor]
cursor = "#839496"
text = "#002b36"

[colors.selection]
background = "#073642"
text = "#93a1a1"

# --- Normal Colors ---
[colors.normal]
black   = "#073642"
red     = "#dc322f"
green   = "#859900"
yellow  = "#b58900"
blue    = "#268bd2"
magenta = "#d33682"
cyan    = "#2aa198"
white   = "#eee8d5"

# --- Bright Colors ---
[colors.bright]
black   = "#002b36"
red     = "#cb4b16"
green   = "#586e75"
yellow  = "#657b83"
blue    = "#839496"
magenta = "#6c71c4"
cyan    = "#93a1a1"
white   = "#fdf6e3"
