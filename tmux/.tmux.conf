# Default shell
set -g default-command "/usr/bin/fish"
set -g default-shell "/usr/bin/fish"

# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect + Continuum (autoguardado de sesiones)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Guardar sesion automaticamente cada 15 minutos
set -g @continuum-save-interval '15'
# Restaurar la ultima sesion al arrancar tmux
set -g @continuum-restore 'on'
# Arrancar continuum automaticamente
set -g @continuum-boot 'off'
# Guardar/restaurar panes con contenido (nvim, etc.)
set -g @resurrect-capture-pane-contents 'on'
# Restaurar el directorio de cada pane
set -g @resurrect-dir '~/.tmux/resurrect'
# Programas que resurrect debe relanzar al restaurar
set -g @resurrect-processes 'ssh nvim vim man less more tail "~nvim->nvim" "~fish->fish"'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E -k "tmux new-session -A -s scratch"
}

# Tema Solarized Dark
set -g status-style "bg=#073642,fg=#839496"
set -g window-status-current-style "bg=#268bd2,fg=#002b36,bold"
set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#073642,fg=#839496"

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:hyperlinks"

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -sg escape-time 10

# Modo vim
set -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# TPM init
run '~/.tmux/plugins/tpm/tpm'
